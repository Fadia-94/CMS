<div class="body">
<div class="container">
    <h1>Register Here</h1>
    <form (ngSubmit)="register()">
        <div class="form-group register-form">
            <label> First Name:</label>
            <input type="text" name="fname" placeholder="Enter your name" class="form-control" [(ngModel)]="user.fname" required><br>
            <label> Last Name:</label>
            <input type="text" name="lname" placeholder="Enter your name" class="form-control" [(ngModel)]="user.lname" required><br>
            <label>Email:</label>
            <input type="email" name="email" placeholder="Enter your email" class="form-control" [(ngModel)]="user.email" required><br>
            <label>Password:</label>
            <input type="password" name="password" placeholder="Enter your password" class="form-control"  [(ngModel)]="user.password" required><br>
        </div>
        <button type="submit" class="btn btn-success">Register</button>
        
    </form>
    </div>
