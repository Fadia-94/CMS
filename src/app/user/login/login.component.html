<div class="body">
<div class="container">
    <h1>Login here</h1>

    <form (ngSubmit)="login()">
        <div class="form-group login-form">
            <label>Email:</label>
            <input type="email" name="email" placeholder="Enter your email" class="form-control" [(ngModel)]="user.email" required><br>
            <label>Password:</label>
            <input type="password" name="password" placeholder="Enter your password" class="form-control" [(ngModel)]="user.password" required><br>
        </div>
        <button type="submit" class="btn btn-success" >Login</button>
        
    </form>
